default:
  requireModule:
    - ts-node/register
  require:
    - src/core/CustomWorld.ts
    - src/hooks/Hooks.ts
    - src/steps/**/*.ts
  paths:
    - features/**/*.feature
    #- features/web/teleconnect.feature
    #- features/web/telecrm.feature
    
  #tags: "@teleconnect_web or @teleconnect_crm"
  #tags: "@teleconnect_web"
  #tags: "@order-journey-api"
  #tags: "@register-user-api"
  #tags: "@teleconnect_registered-user"
  #tags: "@teleconnect_web"
  #tags: "@teleconnect_crm"
  #tags: "@teleconnect_registered-user"
  #tags: "@teleconnect_install"
  tags: "@teleconnect_homepage"
  #tags: "@register-user-api or @teleconnect_registered-user"
  #tags: "@teleconnect_web or @teleconnect_crm or @teleconnect_install"
  format:
    - progress-bar
    - json:reports/cucumber-json/cucumber-report.json
    - html:reports/html/cucumber-report.html
  formatOptions:
    snippetInterface: async-await
  parallel: 1
