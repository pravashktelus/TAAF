default:
  requireModule:
    - ts-node/register
  require:
    - src/core/CustomWorld.ts
    - src/hooks/Hooks.ts
    - src/steps/**/*.ts
  paths:
    - features/**/*.feature
  tags: "@teleconnect_web"
  format:
    - progress-bar
    - json:reports/cucumber-json/cucumber-report.json
    - html:reports/html/cucumber-report.html
  formatOptions:
    snippetInterface: async-await
  parallel: 1
