default:
  requireModule:
    - ts-node/register
  require:
    - src/core/CustomWorld.ts
    - src/hooks/Hooks.ts
    - src/steps/**/*.ts
  paths:
    - features/**/*.feature
    # - features/web/teleconnect.feature
    # - features/web/telecrm.feature
    # - features/web/teleinstall.feature
    # - features/web/teleactivate.feature
    
  #tags: "@teleconnect_orderingestion or @teleconnect_crm"
  #tags: "@teleconnect_orderingestion"
  #tags: "@order-journey-api"
  #tags: "@register-user-api"
  #tags: "@teleconnect_registered-user"
  #tags: "@teleconnect_orderingestion"
  #tags: "@teleconnect_crm"
  #tags: "@teleconnect_registered-user"
  #tags: "@teleconnect_install"
  #tags: "@teleconnect_homepage"
  #tags: "@teleconnect_activate"
  #tags: "@register-user-api or @teleconnect_registered-user"
  #tags: "@customersupport_web"
  tags: "@teleconnect_web and @e2e"
  #tags: "@teleconnect_orderingestion or @teleconnect_crm or @teleconnect_install or @teleconnect_activate or @teleconnect_verify"
  format:
    - progress-bar
    - json:reports/cucumber-json/cucumber-report.json
    - html:reports/html/cucumber-report.html
  formatOptions:
    snippetInterface: async-await
  parallel: 1
