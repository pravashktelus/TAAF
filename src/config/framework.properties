# ═══════════════════════════════════════════════════════════════════════════════
# Framework Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# All non-secret framework settings live here.
# Secrets/tokens go in .env (not committed to source control).

# ─── Environment ──────────────────────────────────────────────────────────────
env=qa
browser=chromium
headless=false
app.url=https://simulapp.online/login


# ─── API Configuration ────────────────────────────────────────────────────────
api.baseUrl=https://simulapp.online


app.maximizeBrowser=false

# ─── Timeouts (ms) ────────────────────────────────────────────────────────────
defaultTimeout=30000
navigationTimeout=60000
apiTimeout=15000
# Slow down each Playwright action by this many ms (useful for demos/debugging)
# 250 — slightly slower
# 500 — noticeable pause between actions (good for demos)
# 1000 — very slow, 1 second between each action
# 0 — full speed (default)
slowMo=500

# ─── Retry & Recovery ─────────────────────────────────────────────────────────
retryCount=2

# ─── Screenshots & Video ──────────────────────────────────────────────────────
screenshotOnFail=true
video=retain-on-failure

# ─── Self-Healing ─────────────────────────────────────────────────────────────
# Toggle self-healing on/off. When disabled, locator failures throw immediately.
#selfHealing.enabled=true
selfHealing.enabled=false
# Timeout (ms) for the initial locator attempt before triggering self-healing
selfHealing.locatorTimeout=5000
# Maximum number of fallback candidates to try
selfHealing.maxCandidates=10
# Whether to use OpenAI for healing suggestions (requires OPENAI_API_KEY in .env)
selfHealing.useOpenAI=true

# ─── Reporting ────────────────────────────────────────────────────────────────
# Attach self-healing HTML report to Allure/Cucumber on each healed step
selfHealing.attachReport=true
# ─── Test User Credentials ────────────────────────────────────────────────────
# Each test run will create a new account with generated email + configured password
test.user.password=TestUser@123
test.user.name=Test User
# Email domain for test accounts (will be: test-{timestamp}@{domain})
test.user.emailDomain=teleconnect.local
