# ═══════════════════════════════════════════════════════════════════════════════
# Framework Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# All non-secret framework settings live here.
# Secrets/tokens go in .env (not committed to source control).

# ─── Environment ──────────────────────────────────────────────────────────────
env=qa
browser=chromium
headless=false
#app.url=https://telecom-app-171032253690.northamerica-northeast1.run.app/login
app.url=https://telecom-app-171032253690.northamerica-northeast1.run.app/login
# ─── API Configuration ────────────────────────────────────────────────────────
api.baseUrl=https://telecom-app-171032253690.northamerica-northeast1.run.app/


app.maximizeBrowser=false

# ─── Timeouts (ms) ────────────────────────────────────────────────────────────
defaultTimeout=30000
navigationTimeout=60000
apiTimeout=15000
# Slow down each Playwright action by this many ms (useful for demos/debugging)
# 250 — slightly slower
# 500 — noticeable pause between actions (good for demos)
# 1000 — very slow, 1 second between each action
# 0 — full speed (default)
slowMo=500

# ─── Retry & Recovery ─────────────────────────────────────────────────────────
retryCount=2

# ─── Screenshots & Video ──────────────────────────────────────────────────────
screenshotOnFail=true
video=on

# ─── Self-Healing ─────────────────────────────────────────────────────────────
# Toggle self-healing on/off. When disabled, locator failures throw immediately.
#selfHealing.enabled=true
selfHealing.enabled=true
# Timeout (ms) for the initial locator attempt before triggering self-healing
selfHealing.locatorTimeout=5000
# Maximum number of fallback candidates to try
selfHealing.maxCandidates=10
# Whether to use OpenAI for healing suggestions (requires OPENAI_API_KEY in .env)
selfHealing.useOpenAI=true

# ─── Reporting ────────────────────────────────────────────────────────────────
# Attach self-healing HTML report to Allure/Cucumber on each healed step
selfHealing.attachReport=true
# ─── Agent Module ─────────────────────────────────────────────────────────────
# XLS/XLSX Column Mapping for Test Cases (requirements/testcases/*.xlsx)
# Update these if your XLS uses different column header names
agents.xls.col.tcId=TC ID
agents.xls.col.title=Title
agents.xls.col.stepNo=Step No
agents.xls.col.action=Action
agents.xls.col.navigation=Navigation
agents.xls.col.testData=Test Data
agents.xls.col.expected=Expected Result
# Group rows by TC ID (carry-forward for multi-row test cases)
agents.xls.groupByTcId=true


# These keys are ONLY read by npm run agent:* commands.
# They have NO effect on npm test or any existing framework behaviour.
# Toggle the entire agent module on/off
agents.enabled=true
# AI provider: openai | anthropic | ollama
agents.ai.provider=openai
# Model to use — leave blank to use provider default (gpt-4-turbo / claude-3-5-sonnet / llama3)
agents.ai.model=gpt-5.6-luna
# Sampling temperature. 0 = deterministic (recommended for precise, repeatable output).
# Some reasoning/o-series models (e.g. gpt-5.6-luna) ONLY accept the default and will error
# on any override — for those, set this to "default" to omit temperature entirely.
agents.ai.temperature=default
# Ollama base URL (only needed when agents.ai.provider=ollama)
# agents.ollama.url=http://localhost:11434
# Output directory for all agent-generated artifacts (features, properties, plans)
agents.output.dir=generated

# ─── App Source Repo (source-repo scanning) ──────────────────────────────────
# When configured + present, the agent reads the application's SOURCE code to
# extract authoritative locators (data-testid), routes, and validation messages.
# This is more accurate/complete than a live-DOM crawl and enables HONEST
# negative-case assertions (real error messages instead of guesses).
# Toggle source-repo scanning on/off.
agents.appRepo.enabled=true
# Local path to a clone of the app source repo (read-only; the agent never writes to it).
agents.appRepo.path=.devrepo/TeleCom_Application
# Remote URL — used by the sync command to clone/pull the repo.
agents.appRepo.url=https://github.com/AshishVats-Telus/TeleCom_Application.git
# Branch to pull when syncing.
agents.appRepo.branch=main
# Where the scanned index is cached.
agents.appRepo.indexPath=generated/source-index.json
# Route → framework page-name mapping. The dev repo's route segments differ from
# the framework's page/.properties names. Format: route=PageName, comma-separated.
# e.g. the customer portal route "/customer" maps to the "TeleConnect" page.
agents.appRepo.pageMap=/customer=TeleConnect,/customer/order=TeleConnect,/customer/orders=TeleConnect,/login=TeleConnect,/crm=TeleCRM,/installation=TeleInstall,/activation=TeleActivate

# ─── Test User Credentials ────────────────────────────────────────────────────
# Each test run will create a new account with generated email + configured password
test.user.password=TestUser@123
test.user.name=Test User
# Email domain for test accounts (will be: test-{timestamp}@{domain})
test.user.emailDomain=teleconnect.local
