# AutomationExercise - Elements
# Captured from live DOM via Playwright MCP — verified end-to-end
# App: https://automationexercise.com
# Flow: Home -> Signup/Login -> Register -> Account Created -> Products -> Add Blue Top -> Cart
# NOTE: this site uses data-qa (NOT data-testid) attributes.

# ============================================================
# HOME / NAVIGATION
# ============================================================
NavSignupLogin=//a[@href='/login']
NavProducts=//a[@href='/products']
NavCart=//a[@href='/view_cart']
NavLogout=//a[@href='/logout']
NavDeleteAccount=//a[@href='/delete_account']
LoggedInAs=//li/a[contains(text(),'Logged in as')]

# ============================================================
# SIGNUP / LOGIN PAGE (/login)
# ============================================================
# New User Signup section
HeadingNewUserSignup=//h2[contains(text(),'New User Signup!')]
InputSignupName=//input[@data-qa='signup-name']
InputSignupEmail=//input[@data-qa='signup-email']
BtnSignup=//button[@data-qa='signup-button']

# Login section
HeadingLoginToAccount=//h2[contains(text(),'Login to your account')]
InputLoginEmail=//input[@data-qa='login-email']
InputLoginPassword=//input[@data-qa='login-password']
BtnLogin=//button[@data-qa='login-button']

# ============================================================
# REGISTRATION FORM (/signup) - Enter Account Information
# ============================================================
HeadingEnterAccountInfo=//b[contains(text(),'Enter Account Information')]
# Title radios (Mr./Mrs.)
RadioTitleMr=//input[@id='id_gender1']
RadioTitleMrs=//input[@id='id_gender2']
InputPassword=//input[@data-qa='password']
SelectDay=//select[@data-qa='days']
SelectMonth=//select[@data-qa='months']
SelectYear=//select[@data-qa='years']
CheckboxNewsletter=//input[@id='newsletter']
CheckboxOffers=//input[@id='optin']

# Address Information
InputFirstName=//input[@data-qa='first_name']
InputLastName=//input[@data-qa='last_name']
InputCompany=//input[@data-qa='company']
InputAddress=//input[@data-qa='address']
InputAddress2=//input[@data-qa='address2']
SelectCountry=//select[@data-qa='country']
InputState=//input[@data-qa='state']
InputCity=//input[@data-qa='city']
InputZipcode=//input[@data-qa='zipcode']
InputMobileNumber=//input[@data-qa='mobile_number']
BtnCreateAccount=//button[@data-qa='create-account']

# ============================================================
# ACCOUNT CREATED (/account_created)
# ============================================================
HeadingAccountCreated=//b[contains(text(),'Account Created!')]
BtnContinue=//a[@data-qa='continue-button']

# ============================================================
# PRODUCTS (/products) - Blue Top (data-product-id=1)
# ============================================================
BtnAddToCartBlueTop=//a[@data-product-id='1' and contains(@class,'add-to-cart')]

# Add-to-cart confirmation modal
CartModal=//div[@id='cartModal']
CartModalAddedHeading=//div[@id='cartModal']//*[contains(text(),'Added!')]
CartModalBody=//div[@id='cartModal']//p[contains(text(),'has been added to cart')]
LinkViewCart=//div[@id='cartModal']//a[@href='/view_cart']

# ============================================================
# CART (/view_cart)
# ============================================================
CartProductBlueTop=//tr[@id='product-1']//td[@class='cart_description']//a[contains(text(),'Blue Top')]
BtnProceedToCheckout=//a[contains(@class,'check_out')]
