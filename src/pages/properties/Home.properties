# Home Page Element Properties
# Format: elementName=locator
# Locator types supported:
#   - CSS selector:        #id, .class, tag
#   - XPath:               //tag[@attr='value']
#   - Text-based:          text=Some Text
#   - Placeholder:         placeholder=Enter name
#   - Role-based:          role=button[name='Submit']
#   - Data-testid:         data-testid=my-element
#   - Chained (parent>>child): .nav >> .logo

# ─── Navigation ───────────────────────────────────────────────────────────────
Logo=.app_logo
Title=text=Swag Labs
MenuButton=#react-burger-menu-btn
CloseMenu=#react-burger-cross-btn

# ─── Menu Items ───────────────────────────────────────────────────────────────
AllItemsLink=text=All Items
AboutLink=text=About
LogoutLink=text=Logout
ResetLink=text=Reset App State

# ─── Shopping Cart ────────────────────────────────────────────────────────────
CartIcon=.shopping_cart_link
CartBadge=.shopping_cart_badge

# ─── Product List ─────────────────────────────────────────────────────────────
ProductList=.inventory_list
ProductItem=.inventory_item
ProductName=.inventory_item:first-child >> .inventory_item_name
ProductPrice=.inventory_item:first-child >> .inventory_item_price
ProductDescription=.inventory_item_desc
AddToCartButton=.inventory_item:first-child >> text=Add to cart
RemoveButton=.inventory_item:first-child >> text=Remove
SortDropdown=[data-test='product_sort_container']

# ─── Footer ───────────────────────────────────────────────────────────────────
FooterText=.footer_copy
TwitterLink=//a[@href='https://twitter.com/saucelabs']
FacebookLink=//a[@href='https://www.facebook.com/saucelabs']
LinkedInLink=//a[@href='https://www.linkedin.com/company/sauce-labs/']
