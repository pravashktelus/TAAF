# Login Page Element Properties
# Format: elementName=locator

# ─── Form Fields ──────────────────────────────────────────────────────────────
UsernameField=#user-name
PasswordField=#password
LoginButton=#login-button

# ─── Error Messages ───────────────────────────────────────────────────────────
ErrorMessage=[data-test='error']
ErrorIcon=.error_icon
ErrorCloseButton=.error-button

# ─── Labels ───────────────────────────────────────────────────────────────────
PageLogo=.login_logo
CredentialContainer=.login_credentials_wrap
AcceptedUsernamesHeader=//h4[contains(text(),'Accepted usernames')]
PasswordHeader=//h4[contains(text(),'Password for all users')]
