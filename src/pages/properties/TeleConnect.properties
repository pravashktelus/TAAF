# TeleConnect - Elements
# Verified via Playwright MCP + app source repo (data-testid) — end-to-end
# App: https://telecom-app-171032253690.northamerica-northeast1.run.app
# Flow: Login -> Register -> Dashboard -> 6-step Order Wizard -> Success

# ============================================================
# LOGIN PAGE (/login)
# ============================================================
InputLoginEmail=//input[@data-testid='login-email']
InputLoginPassword=//input[@data-testid='login-password']
BtnLoginSubmit=//button[@data-testid='login-submit']
BtnSwitchToRegister=//button[@data-testid='switch-to-register']
BtnQuickLoginCrm=//button[@data-testid='quick-login-crm']
BtnQuickLoginInstallation=//button[@data-testid='quick-login-installation']
BtnQuickLoginActivation=//button[@data-testid='quick-login-activation']

# ============================================================
# REGISTRATION (reuses login-email / login-password testids)
# ============================================================
InputRegisterName=//input[@data-testid='register-name']
InputRegisterEmail=//input[@data-testid='login-email']
InputRegisterPassword=//input[@data-testid='login-password']
BtnRegisterSubmit=//button[@data-testid='register-submit']

# ============================================================
# CUSTOMER DASHBOARD (/customer)
# ============================================================
NavDashboard=//a[@data-testid='nav-dashboard']
